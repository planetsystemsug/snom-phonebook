services:
  snom-phonebook:
    build: .
    container_name: snom-phonebook
    ports:
      - "8081:80"
    environment:
      APP_DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      PHONEBOOK_AUTH_USER: ${PHONEBOOK_AUTH_USER:-}
      PHONEBOOK_AUTH_PASSWORD_HASH: ${PHONEBOOK_AUTH_PASSWORD_HASH:-}
    volumes:
      - phonebook-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      # Check the application database directly. An HTTP health request would
      # otherwise create an Apache access-log line every 30 seconds.
      test: ["CMD", "php", "-r", 'require "/var/www/html/src/App.php"; SnomPhonebook\db(SnomPhonebook\config());']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  phonebook-data:
